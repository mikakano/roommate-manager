    if (!button || button.disabled) return;
    if (button.dataset.view) { navigate(button.dataset.view, button.dataset.filter); return; }
    const action = button.dataset.action, entityId = button.dataset.id;
    if (!action) return;
    if (action === 'close-dialog') { closeModal(); return; }
    if (action === 'expense-filter') { expenseFilter = button.dataset.filter; render(); main.querySelector(`[data-filter="${expenseFilter}"]`)?.focus({ preventScroll: true }); return; }
    if (action === 'chore-filter') { choreFilter = button.dataset.filter; render(); main.querySelector(`[data-filter="${choreFilter}"]`)?.focus({ preventScroll: true }); return; }
    if (action === 'toggle-task') {
      const task = state.tasks.find(t => t.id === entityId); task.done = !task.done; task.manual=true; update(task.done ? '值日已完成，辛苦啦。' : '已撤销完成状态。'); main.querySelector(`[data-action="toggle-task"][data-id="${CSS.escape(entityId)}"]`)?.focus({ preventScroll: true }); return;
    }
    if (action === 'toggle-share') {
      const b = state.bills.find(b => b.id === entityId), share = b.shares.find(s => s.member === button.dataset.member);
      if(!C.canSettle(b,share,state.currentMember)){showToast('仅创建人或该份额所属室友可修改状态。');return;}
      share.settled = !share.settled; update(share.settled ? '已记录结清，首页金额同步更新。' : '已撤销结清状态。'); main.querySelector(`[data-action="toggle-share"][data-id="${CSS.escape(entityId)}"][data-member="${share.member}"]`)?.focus({ preventScroll: true }); return;
    }
    if(action==='toggle-rotation'){const r=state.rotations.find(r=>r.id===entityId);r.active=!r.active;C.generate(state);update('轮班规则已'+(r.active?'启用':'暂停'));return;}
    if(action==='opinion'&&button.dataset.status!=='建议修改'){const r=state.rules.find(r=>r.id===entityId),actor=member(state.currentMember);if(button.dataset.status==='未表态')delete r.opinions[actor.id];else r.opinions[actor.id]={name:actor.name,status:'已阅读',at:new Date().toISOString()};update('本地意见已更新');return;}
    if(dialog.open)dialog.close();
    openModal(action, entityId);
  });
  document.addEventListener('change', event => {
    if (event.target.id === 'current-member') { state.currentMember = event.target.value; update(`已切换为${member(state.currentMember).name}的查看视角。`); document.querySelector('#current-member').focus(); }
    if (event.target.dataset.taskOwner) { const task = state.tasks.find(t => t.id === event.target.dataset.taskOwner); task.owner = event.target.value; task.manual=true; update('值日负责人已更新。'); document.querySelector(`#owner-${CSS.escape(task.id)}`)?.focus({ preventScroll: true }); }
  });
  dialog.addEventListener('cancel', event => { event.preventDefault(); closeModal(); });
  dialog.addEventListener('click', event => { if (event.target === dialog) { const box = dialog.getBoundingClientRect(); if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) closeModal(); } });
  window.addEventListener('hashchange', () => { const next = location.hash.slice(1); if (names[next]) navigate(next); });
  window.addEventListener('pageshow', () => render());
  render();
})();

</script>
<!-- END INLINE APP -->
