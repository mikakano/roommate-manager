  });
  document.addEventListener('change', event => {
    if (event.target.id === 'current-member') { state.currentMember = event.target.value; update(`已切换为${member(state.currentMember).name}的查看视角。`); document.querySelector('#current-member').focus(); }
    if (event.target.dataset.taskOwner) { const task = state.tasks.find(t => t.id === event.target.dataset.taskOwner); task.owner = event.target.value; update('值日负责人已更新。'); document.querySelector(`#owner-${CSS.escape(task.id)}`)?.focus({ preventScroll: true }); }
  });
  dialog.addEventListener('cancel', event => { event.preventDefault(); closeModal(); });
  dialog.addEventListener('click', event => { if (event.target === dialog) { const box = dialog.getBoundingClientRect(); if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) closeModal(); } });
  window.addEventListener('hashchange', () => { const next = location.hash.slice(1); if (names[next]) navigate(next); });
  window.addEventListener('pageshow', () => render());
  render();
})();

</script>
<!-- END INLINE APP -->
